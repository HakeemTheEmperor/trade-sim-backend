openapi: 3.0.0
info:
  title: Stock Trade Simulator Web API
  description: Web Api for Stock Trade Simulator
  license:
    name: Apache 2.0
    url: "https://www.apache.org/licenses/LICENSE-2.0.html"
  version: 1.0.0
  contact:
    email: hakeemtheemperor@gmail.com
    name: HTE
servers:
  - url: http://127.0.0.1:5000/api/v1
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserSignUp:
      type: object
      properties:
        first_name:
          type: string
          example: Toluwalase
        last_name:
          type: string
          example: Akinyemi
        email:
          type: string
          format: email
          example: hakeemtheemperor@gmail.com
        password:
          type: string
          format: password
          example: Password123@
    InvalidApiKey:
      type: object
      properties:
        error_code:
          type: number
          example: 401
        message:
          type: string
          example: Invalid or missing API key or Invalid Token
        status:
          type: string
          example: INVALID API KEY OR INVALID TOKEN
    DataNotFound:
      type: object
      properties:
        error_code:
          type: number
          example: 404
        message:
          type: string
          example: The data you were looking for was not found
        status:
          type: string
          example: DATA NOT FOUND
    InsufficientFunds:
      type: object
      properties:
        error_code:
          type: number
          example: 403
        message:
          type: string
          example: Insufficient Funds
        status:
          type: string
          example: INSUFFICIENT FUNDS
    AlreadyExists:
      type: object
      properties:
        error_code:
          type: number
          example: 409
        message:
          type: string
          example: The data you are trying to create already exists
        status:
          type: string
          example: DATA ALREADY EXISTS
    MissingProperties:
      type: object
      properties:
        error_code:
          type: number
          example: 400
        message:
          type: string
          example: Your request could not be processed as certain properties are missing
        status:
          type: string
          example: MISSING REQUIRED PROPERTIES
    RuntimeError:
      type: object
      properties:
        error_code:
          type: number
          example: 500
        message:
          type: string
          example: "An unexpected error occured: {error}"
        status:
          type: string
          example: RUNTIME ERROR
    Wallet:
      type: object
      properties:
        balance:
          type: number
          format: float
          example: 100000.0
        created_at:
          type: string
          format: date-time
          example: "2025-03-09T08:23:47.015907+00:00"
        currency:
          type: string
          example: "USD"
        id:
          type: integer
          example: 4
        updated_at:
          type: string
          format: date-time
          example: "2025-03-09T08:23:47.015907+00:00"
    User:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          example: "2025-03-09T08:23:46.768393+00:00"
        email:
          type: string
          format: email
          example: "toluwalas.akinyemi@gmail.com"
        first_name:
          type: string
          example: "Toluwalase"
        id:
          type: integer
          example: 5
        last_name:
          type: string
          example: "Akinyemi"
        role:
          type: string
          example: "USER"
        is_verified:
          type: boolean
          description: >
            Whether the user has confirmed their email with the signup OTP.
            Always true on any user returned by an authenticated endpoint — a
            session is only ever issued to a verified account.
          example: true
        updated_at:
          type: string
          format: date-time
          example: "2025-03-09T08:23:46.768393+00:00"
        wallets:
          type: array
          items:
            $ref: "#/components/schemas/Wallet"

    RateLimited:
      type: object
      properties:
        message:
          type: string
          example: Too many requests. Please slow down and try again later.
        status:
          type: string
          example: RATE LIMIT EXCEEDED
        status_code:
          type: integer
          example: 429

    Transaction:
      type: object
      properties:
        id:
          type: integer
          example: 4
        user_id:
          type: integer
          example: 2
        currency:
          type: string
          example: "USD"
        from_wallet_id:
          type: integer
          nullable: true
          example: null
        to_wallet_id:
          type: integer
          nullable: true
          example: 1
        transaction_type:
          type: string
          enum: ["CREDIT", "DEBIT"]
          example: "CREDIT"
        transaction_category:
          type: string
          example: "WALLET_TRANSFER"
        total_value:
          type: number
          format: double
          example: 2999.2558
        price_per_share:
          type: number
          format: double
          nullable: true
          example: null
        quantity:
          type: number
          format: double
          nullable: true
          example: null
        stock_symbol:
          type: string
          nullable: true
          example: null
        time:
          type: string
          format: date-time
          example: "2025-03-14T17:59:46.772100+00:00"
tags:
  - name: Auth
    description: Authentication related endpoints
  - name: Wallets
    description: Wallet related endpoints
  - name: Transactions
    description: Transaction related endpoints
  - name: User
    description: User related endpoints
  - name: Stocks
    description: Stocks related Endpoints

paths:
  /auth/signup:
    post:
      operationId: authSignupUser
      summary: User account gets created (unverified)
      description: >
        Creates the account and emails a 6-digit verification code. No session
        is issued: the account is inactive and /auth/signin will refuse it until
        the code is submitted to /auth/verify-email.
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSignUp"
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Account created. Enter the 6-digit code we emailed you to activate it.
                  email:
                    type: string
                    format: email
                    example: hakeemtheemperor@gmail.com
                  verification_required:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: VERIFICATION REQUIRED
          description: Created; awaiting email verification. No cookie is set.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissingProperties"
          description: The request is missing some required properties
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidApiKey"
          description: Invalid Api Key entered
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlreadyExists"
          description: The user already exists
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeError"
          description: Unexpected error occured
  /auth/signin:
    post:
      operationId: authSigninUser
      summary: Sign in to the application
      description: User Sign-in to the Stock Trade App
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: hakeemtheemperor@gmail.com
                password:
                  type: string
                  format: password
                  example: Password123@
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Sign-in successful
                  user:
                    $ref: "#/components/schemas/User"
          description: >
            Successfully signed in. The JWT is set as an HttpOnly cookie, not
            returned in the body.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissingProperties"
          description: The request is missing some required properties
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidApiKey"
          description: Invalid Api Key entered
        "403":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Your account has not been verified.
                  status:
                    type: string
                    example: ACCOUNT_UNVERIFIED
                  email:
                    type: string
                    format: email
                    example: hakeemtheemperor@gmail.com
          description: >
            The password was correct but the account has never been verified.
            No cookie is set. Clients should branch on `status`, not the message,
            and send the user to the verification page. Only returned after a
            correct password, so it discloses nothing to a caller who does not
            already hold the credentials.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlreadyExists"
          description: The user already exists
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeError"
          description: Unexpected error occured

  /auth/verify-email:
    post:
      operationId: authVerifyEmail
      summary: Activate an account with the emailed OTP
      description: >
        Submits the 6-digit code emailed at signup. On success the account is
        marked verified AND signed in — the JWT and CSRF cookies are set, so no
        separate /auth/signin call is needed.


        Codes expire after 10 minutes, allow 5 attempts, and are single use.
        Issuing a new code invalidates the previous one. Every failure mode
        (wrong code, expired code, exhausted attempts, unknown email) returns the
        same 400 message on purpose: this endpoint takes no password, so it must
        not reveal whether an account exists.
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  format: email
                  example: hakeemtheemperor@gmail.com
                otp:
                  type: string
                  example: "482913"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Email verified successfully
                  user:
                    $ref: "#/components/schemas/User"
          description: >
            Verified and signed in. Sets the access and CSRF cookies. An
            already-verified account also returns 200 (idempotent no-op) so a
            double-submitted form doesn't read as a failure.
        "400":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid or expired code. Request a new one and try again.
                  status:
                    type: string
                    example: Value Error
                  error_code:
                    type: integer
                    example: 400
          description: Missing fields, or an invalid/expired/exhausted code
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimited"
          description: Too many attempts (10 per 5 minutes per client)
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeError"
          description: Unexpected error occured

  /auth/resend-otp:
    post:
      operationId: authResendOtp
      summary: Re-send the signup verification code
      description: >
        Issues a new code and emails it, invalidating any previous code.


        Always returns 200 with a fixed message. An unknown address, an
        already-verified account and an active 60-second cooldown are all
        indistinguishable from the response — without a password to authenticate
        the caller, anything else would make this a free account-enumeration
        endpoint.
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: hakeemtheemperor@gmail.com
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: If that account exists and is unverified, a new code has been sent.
          description: Request accepted (whether or not an email was actually sent)
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissingProperties"
          description: The email field is missing or empty
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimited"
          description: Too many requests (3 per 5 minutes per client)

  /auth/logout:
    get:
      operationId: authLogoutUser
      summary: User logs out and deactivate token to prevent reuse
      description: User sign out and deactivate token
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: You have successfully logged out of your account
                  status_code:
                    type: number
                    example: 200
                  status:
                    type: string
                    example: SIGN OUT SUCCESS
          description: Successfully signed out the user
        "400":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: We were unable to log you out of your account
                  status_code:
                    type: number
                    example: 400
                  status:
                    type: string
                    example: SIGN OUT FAIL
          description: Unable to sign out user
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeError"
          description: Unexpected error occured
  /auth/admin-signup:
    post:
      operationId: adminAccountCreation
      summary: Creates account for admin
      description: Account creation for admin
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSignUp"
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Signin Successful
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    $ref: "#/components/schemas/User"
          description: Successfully signed in
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissingProperties"
          description: The request is missing some required properties
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidApiKey"
          description: Invalid Api Key entered
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlreadyExists"
          description: The user already exists
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeError"
          description: Unexpected error occured
  /auth/reset-password:
    post:
      operationId: authResetPassword
      summary: Reset password
      description: Password Change
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                old_password:
                  type: string
                  format: password
                  example: Password123@
                new_password:
                  type: string
                  format: password
                  example: PasswordNew123@
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password reset successfully, please sign in again
                  user:
                    $ref: "#/components/schemas/User"
          description: Password Reset successfully
        "400":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid Data Entered
          description: Unexpected error occured
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeError"
          description: Unexpected error occured

  /wallet/all:
    get:
      operationId: walletAllUsers
      summary: Get user wallets
      description: Get all wallets belonging to the User
      tags:
        - Wallets
      security:
        - BearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Wallets retrieved successfully
                  wallets:
                    type: array
                    items:
                      $ref: "#/components/schemas/Wallet"
          description: User has wallets and they've been retrieved successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidApiKey"
          description: Invalid Api Key entered
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataNotFound"
          description: Wallet Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeError"
          description: Unexpected error occured

  /wallet/{id}:
    get:
      operationId: walletById
      summary: Get the particular wallet
      description: Get the wallet with the specified Id
      tags:
        - Wallets
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The Id of the wallet to retrieve
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Wallet retrieved successfully
                  wallet:
                    $ref: "#/components/schemas/Wallet"
          description: Wallet retrieved succesfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidApiKey"
          description: Invalid Api Key entered
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataNotFound"
          description: Wallet Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeError"
          description: Unexpected error occured

  /wallet/create:
    post:
      operationId: walletCreate
      summary: Create a new wallet
      description: Creates a new wallet for the authenticated user.
      tags:
        - Wallets
      security:
        - BearerAuth: []
      parameters:
        - name: currency
          in: query
          required: true
          schema:
            type: string
          description: The currency of the wallet (e.g., "USD", "NGN").
      responses:
        201:
          description: Wallet created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Wallet created Successfully
                  wallet:
                    $ref: "#/components/schemas/Wallet"
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidApiKey"
          description: Invalid Api Key entered or Invalid Token
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlreadyExists"
          description: The wallet already exists
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeError"
          description: Unexpected error occured

  /wallet/transfer:
    post:
      operationId: walletTransferFunds
      summary: Transfer funds between wallets
      description: Transfers funds from one wallet to another for the authenticated user.
      tags:
        - Wallets
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - from_wallet_id
                - to_wallet_id
                - amount
              properties:
                from_wallet_id:
                  type: integer
                  description: The ID of the wallet to transfer funds from.
                  example: 1
                to_wallet_id:
                  type: integer
                  description: The ID of the wallet to transfer funds to.
                  example: 2
                amount:
                  type: number
                  format: float
                  description: The amount to transfer.
                  example: 100.50
      responses:
        200:
          description: Transfer Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Funds transferred successfully
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissingProperties"
          description: The request is missing some required properties
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidApiKey"
          description: Invalid Api Key entered or Invalid Token
        403:
          description: Insufficient Funds for transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientFunds"
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeError"
          description: Unexpected error occured

  /wallet/delete:
    delete:
      operationId: walletDeleteById
      summary: Delete selected wallet
      description: Delete the user wallet.
      tags:
        - Wallets
      security:
        - BearerAuth: []
      parameters:
        - name: wallet_id
          in: query
          required: true
          schema:
            type: integer
          description: The ID of the wallet to be deleted.
      responses:
        200:
          description: Wallet deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Wallet deleted Successfully
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissingProperties"
          description: The request is missing some required properties
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidApiKey"
          description: Invalid Api Key entered or Invalid Token
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataNotFound"
          description: Wallet Not Found
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlreadyExists"
          description: The wallet already exists
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeError"
          description: Unexpected error occured

  /transactions/history:
    get:
      operationId: transactionsHistoryUser
      summary: Get user transaction history
      description: Retrieves the transaction history for a user's wallet, with optional filtering and pagination.
      tags:
        - Transactions
      security:
        - BearerAuth: []
      parameters:
        - name: wallet_id
          in: query
          required: false
          schema:
            type: integer
          description: The ID of the wallet to filter transactions.
        - name: currency
          in: query
          required: false
          schema:
            type: string
          description: Filter transactions by currency.
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Filter transactions by category.
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
          description: Sort transactions by a specified field.
        - name: page
          in: query
          required: false
          schema:
            type: integer
          description: The page number for pagination.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Number of transactions per page.
      responses:
        200:
          description: Transaction history retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Transaction history gotten successfully"
                  page:
                    type: integer
                    example: 1
                  pages:
                    type: integer
                    example: 1
                  per_page:
                    type: integer
                    example: 10
                  total:
                    type: integer
                    example: 2
                  transactions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissingProperties"
          description: The request is missing some required properties
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidApiKey"
          description: Invalid Api Key entered or Invalid Token
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeError"
          description: Unexpected error occured
